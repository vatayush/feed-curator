<title>Feed Curator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one quiet reading column (max 640px); sticky header with the run's status and three tabs;
     posts read like pages of a book (Literata), controls stay in a plain UI sans. */
  :root {
    --bg: #eceff2;
    --surface: #ffffff;
    --sunken: #f5f6f8;
    --ink: #16191d;
    --muted: #5b646e;
    --line: #d7dce2;
    --accent: #2b5c8e;
    --accent-soft: #e2eaf3;
    --keep: #2e7553;
    --keep-soft: #e1f0e8;
    --drop: #9f4338;
    --drop-soft: #f6e4e1;
    --warn: #8a5a12;
    --warn-soft: #f6ecd9;
    --read: "Literata", "Iowan Old Style", Georgia, serif;
    --ui: "Public Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111316; --surface: #191c20; --sunken: #15181b; --ink: #e6e9ed; --muted: #97a0aa; --line: #2a2f35;
      --accent: #8ab4de; --accent-soft: #1f2b38; --keep: #73c29a; --keep-soft: #183026;
      --drop: #e68d82; --drop-soft: #3a211e; --warn: #e3b46a; --warn-soft: #33281a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111316; --surface: #191c20; --sunken: #15181b; --ink: #e6e9ed; --muted: #97a0aa; --line: #2a2f35;
    --accent: #8ab4de; --accent-soft: #1f2b38; --keep: #73c29a; --keep-soft: #183026;
    --drop: #e68d82; --drop-soft: #3a211e; --warn: #e3b46a; --warn-soft: #33281a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  a { color: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .head { display: flex; flex-direction: column; gap: 6px; padding-block: 16px 10px; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font: 600 21px/1.2 var(--read); letter-spacing: -0.01em; }
  .when { font: 13px var(--mono); color: var(--muted); }
  .sources { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
    font: 500 12px/1.6 var(--ui); background: var(--sunken); color: var(--muted); border: 1px solid var(--line);
    white-space: nowrap;
  }
  .chip.ok { color: var(--keep); background: var(--keep-soft); border-color: transparent; }
  .chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.bad { color: var(--drop); background: var(--drop-soft); border-color: transparent; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button {
    flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 4px 9px;
    font: 600 14px var(--ui); color: var(--muted); display: inline-flex; justify-content: center; gap: 6px;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .count { font: 500 12px var(--mono); color: var(--muted); }

  main { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 48px; }

  /* Notices */
  .notice { border-radius: var(--radius); padding: 12px 14px; background: var(--accent-soft); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
  .notice.warn { background: var(--warn-soft); }
  .notice strong { font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 48px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .empty h2 { margin: 0; font: 600 18px var(--read); color: var(--ink); }
  .empty p { margin: 0; max-width: 42ch; }

  /* Groups and posts */
  .group-head { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .group-head h2 { margin: 0; font: 600 13px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .group-head .count { margin-left: auto; }

  article.post {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  article.post.voted-up { border-color: color-mix(in srgb, var(--keep) 45%, var(--line)); }
  article.post.voted-down { opacity: 0.72; }
  .byline { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; min-width: 0; font-size: 14px; }
  .byline .name { font-weight: 600; color: var(--ink); text-decoration: none; }
  .byline .name:hover { text-decoration: underline; }
  .byline .handle, .byline .time { color: var(--muted); }
  .byline .time { font: 12.5px var(--mono); margin-left: auto; }
  .context { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
  .text {
    font: 16px/1.55 var(--read); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 9; overflow: hidden;
  }
  .text.open { display: block; }
  .text.media { font-style: italic; color: var(--muted); }
  .more { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 600; margin-top: -4px; }
  .quote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px; }
  .quote .who { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .quote p { margin: 0; font: 14.5px/1.5 var(--read); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }

  .why { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; min-width: 0; }
  .score { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 6px; background: var(--sunken); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .score.hi { background: var(--keep-soft); color: var(--keep); }
  .score.lo { background: var(--drop-soft); color: var(--drop); }
  .why .reason { min-width: 0; }
  .actions { display: flex; align-items: center; gap: 6px; }
  .vote {
    border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 14px;
    display: inline-flex; align-items: center; gap: 4px; color: var(--muted);
  }
  .vote[aria-pressed="true"].up { background: var(--keep-soft); border-color: transparent; color: var(--keep); }
  .vote[aria-pressed="true"].down { background: var(--drop-soft); border-color: transparent; color: var(--drop); }
  .open-link { margin-left: auto; font-size: 13px; font-weight: 600; text-decoration: none; }
  .open-link:hover { text-decoration: underline; }

  /* Settings */
  section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  section.panel h2 { margin: 0; font: 600 17px var(--read); }
  section.panel > p.hint { margin: -6px 0 0; color: var(--muted); font-size: 13.5px; }
  form.add { display: flex; gap: 8px; flex-wrap: wrap; }
  form.add input[type="text"], form.add select {
    flex: 1 1 180px; min-width: 0; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunken);
  }
  form.add select { flex: 0 0 auto; }
  .btn { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; background: var(--accent); color: var(--surface); }
  .btn.quiet { background: var(--sunken); color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: var(--drop-soft); color: var(--drop); }
  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.items li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
  ul.items li:first-child { border-top: 0; }
  ul.items .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ul.items li.paused .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
  .x:hover { color: var(--drop); background: var(--drop-soft); }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
  .switch input:checked + span { background: var(--keep); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .people-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .people-cols h3 { margin: 0 0 4px; font: 600 13px var(--ui); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 520px) { .people-cols { grid-template-columns: 1fr; } }
  .kw { display: flex; flex-wrap: wrap; gap: 6px; }
  .kw .chip { padding-right: 2px; font-size: 13px; }
  .kw .chip .x { font-size: 15px; padding: 0 5px; }
  .none { color: var(--muted); font-size: 13.5px; padding: 4px 0; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row input { flex: 1; accent-color: var(--accent); }
  .slider-row output { font: 500 15px var(--mono); min-width: 3.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status-line { font-size: 13px; color: var(--muted); }
  .status-line.err { color: var(--drop); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="head">
      <div class="title-row">
        <h1 id="heading">Feed Curator</h1>
        <span class="when" id="when"></span>
      </div>
      <div class="sources" id="sources"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-digest" aria-selected="true" aria-controls="view">Digest <span class="count" id="n-digest"></span></button>
      <button role="tab" id="tab-dropped" aria-selected="false" aria-controls="view">Dropped <span class="count" id="n-dropped"></span></button>
      <button role="tab" id="tab-settings" aria-selected="false" aria-controls="view">Preferences</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <main id="view" role="tabpanel">
    <div class="empty" id="boot">
      <h2>Loading your digest</h2>
      <p>Your curated posts from X and LinkedIn appear here twice a day, after each capture.</p>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const S = {
    db: null,
    downloads: null,
    offline: false,
    digest: undefined, // undefined = loading, null = none yet
    prefs: [], people: [], keywords: [], votes: new Map(),
    threshold: 0.6,
    tab: "digest",
    open: new Set(),
    confirmReset: false,
    exportMsg: "",
  };
  const VOTE_CAP = 500;
  let prunedVotes = false;

  try { const t = localStorage.getItem("fc.tab"); if (t) S.tab = t; } catch {}
  try { if (location.hash === "#preferences") S.tab = "settings"; } catch {}

  // ---------- helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }
  const docId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190) || "_";
  const SITE = { x: "X", linkedin: "LinkedIn" };
  const FEED = { following: "Following", "for-you": "For you" };

  function ago(iso) {
    const ms = Date.now() - Date.parse(iso);
    if (!isFinite(ms)) return "";
    const m = Math.round(ms / 60000);
    if (m < 60) return `${Math.max(m, 1)}m`;
    const hrs = Math.round(m / 60);
    if (hrs < 48) return `${hrs}h`;
    return `${Math.round(hrs / 24)}d`;
  }
  function stamp(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function sourceLabel(p) {
    const site = SITE[p.site] || p.site || "";
    const feeds = (p.feeds || []).map(f => FEED[f]).filter(Boolean);
    return feeds.length ? `${site} · ${feeds.join(" + ")}` : site;
  }

  // ---------- partition ----------
  function partition() {
    const posts = (S.digest && Array.isArray(S.digest.posts)) ? S.digest.posts : [];
    const kept = [], dropped = [];
    for (const p of posts) (p.score == null || p.score >= S.threshold ? kept : dropped).push(p);
    const byScore = (a, b) => (b.score ?? -1) - (a.score ?? -1);
    kept.sort(byScore);
    dropped.sort(byScore);
    return { kept, dropped };
  }
  function groups(list) {
    if (!list.some(p => p.topic)) return [{ topic: null, posts: list }];
    const map = new Map();
    for (const p of list) {
      const t = p.topic || "Other";
      if (!map.has(t)) map.set(t, []);
      map.get(t).push(p);
    }
    return [...map].map(([topic, posts]) => ({ topic, posts }));
  }

  // ---------- header ----------
  function renderHeader(counts) {
    const d = S.digest;
    const heading = document.getElementById("heading");
    const when = document.getElementById("when");
    const sources = document.getElementById("sources");
    sources.replaceChildren();
    if (d && d.generatedAt) {
      const hr = new Date(d.generatedAt).getHours();
      heading.textContent = d.sample ? "Feed Curator" : hr < 12 ? "Morning digest" : hr < 17 ? "Afternoon digest" : "Evening digest";
      when.textContent = stamp(d.generatedAt);
      for (const s of d.sources || []) {
        const cls = s.status === "ok" ? "ok" : s.status === "disabled" ? "" : s.status === "stopped" ? "bad" : "warn";
        const label = SITE[s.site] || s.site;
        const captured = s.capturedAt ? new Date(s.capturedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "";
        const text = s.status === "ok" ? `${label} · ${s.postCount} posts${captured ? ` · captured ${captured}` : ""}`
          : s.status === "stale" ? `${label} · no new capture`
          : s.status === "disabled" ? `${label} off`
          : s.status === "paused" ? `${label} paused`
          : s.status === "stopped" ? `${label} stopped`
          : `${label} · no posts`;
        sources.append(h("span", { class: `chip ${cls}`, title: s.reason || "" }, h("span", { class: "dot" }), text));
      }
    } else {
      heading.textContent = "Feed Curator";
      when.textContent = "";
    }
    document.getElementById("n-digest").textContent = counts ? String(counts.kept) : "";
    document.getElementById("n-dropped").textContent = counts ? String(counts.dropped) : "";
    for (const t of ["digest", "dropped", "settings"]) {
      document.getElementById(`tab-${t}`).setAttribute("aria-selected", String(S.tab === t));
    }
  }

  // ---------- posts ----------
  function postCard(p) {
    const vote = S.votes.get(docId(p.id))?.vote || 0;
    const opened = S.open.has(p.id);
    const text = (p.text || "").trim();
    const long = text.length > 420 || text.split("\n").length > 8;

    const textEl = text
      ? h("p", { class: `text${opened ? " open" : ""}`, text })
      : h("p", { class: "text media", text: "Image or video post, open it to see." });

    const score = typeof p.score === "number" ? p.score : null;
    const scoreCls = score == null ? "" : score >= S.threshold ? "hi" : "lo";

    return h("article", { class: `post${vote > 0 ? " voted-up" : vote < 0 ? " voted-down" : ""}` },
      h("div", { class: "byline" },
        p.author?.profileUrl
          ? h("a", { class: "name", href: p.author.profileUrl, target: "_blank", rel: "noopener", text: p.author.name || p.author.handle })
          : h("span", { class: "name", text: p.author?.name || "" }),
        p.author?.handle && p.author.handle !== p.author.name ? h("span", { class: "handle", text: p.author.handle }) : null,
        h("span", { class: "chip", text: sourceLabel(p) }),
        h("span", { class: "time", text: p.postedAt ? ago(p.postedAt) : (p.postedAtText || "") }),
      ),
      p.context ? h("div", { class: "context", text: p.context }) : null,
      textEl,
      text && long && !opened
        ? h("button", { class: "more", type: "button", onclick: () => { S.open.add(p.id); render(); } }, "Show more")
        : null,
      p.quoted ? h("div", { class: "quote" },
        h("span", { class: "who", text: `Quoting ${p.quoted.author}` }),
        h("p", { text: p.quoted.text || "" })) : null,
      h("div", { class: "why" },
        h("span", { class: `score ${scoreCls}`, text: score == null ? "—" : score.toFixed(2) }),
        h("span", { class: "reason", text: p.reason || (S.digest?.sample ? "Not scored yet" : "") }),
      ),
      h("div", { class: "actions" },
        h("button", { class: "vote up", type: "button", "aria-pressed": String(vote > 0), "aria-label": "More like this", title: "More like this", onclick: () => castVote(p, 1) }, "👍"),
        h("button", { class: "vote down", type: "button", "aria-pressed": String(vote < 0), "aria-label": "Less like this", title: "Less like this", onclick: () => castVote(p, -1) }, "👎"),
        p.url ? h("a", { class: "open-link", href: p.url, target: "_blank", rel: "noopener" }, p.truncated ? `Read all on ${SITE[p.site] || "site"} ↗` : `Open on ${SITE[p.site] || "site"} ↗`) : null,
      ),
    );
  }

  function renderList(list, kind) {
    const out = [];
    const d = S.digest;
    if (d && d.sample && kind === "digest") {
      out.push(h("div", { class: "notice" },
        h("strong", { text: "Sample from your last capture" }),
        h("span", { text: "These are real posts from your feed, not yet curated. Claude starts scoring them against your preferences after the next scheduled capture. Votes you leave now already count." })));
    }
    for (const s of (d && d.sources) || []) {
      if (s.status === "ok" || s.status === "disabled") continue;
      out.push(h("div", { class: "notice warn" },
        h("strong", { text: `${SITE[s.site] || s.site}: ${s.status === "paused" ? "paused" : s.status === "stopped" ? "stopped for safety" : s.status === "stale" ? "no new capture, showing the last digest" : "no posts captured"}` }),
        h("span", { text: s.reason || "" })));
    }
    if (!list.length) {
      out.push(h("div", { class: "empty" },
        h("h2", { text: kind === "digest" ? "Nothing passed the bar" : "Nothing dropped" }),
        h("p", { text: kind === "digest"
          ? "No post scored at or above your strictness setting. Lower it under Preferences, or check Dropped."
          : "Every post in this digest scored at or above your strictness setting." })));
      return out;
    }
    for (const g of groups(list)) {
      if (g.topic) out.push(h("div", { class: "group-head" }, h("h2", { text: g.topic }), h("span", { class: "count", text: String(g.posts.length) })));
      for (const p of g.posts) out.push(postCard(p));
    }
    return out;
  }

  // ---------- settings ----------
  function listItem(label, extra, onRemove, cls) {
    return h("li", { class: cls || "" }, extra, h("span", { class: "label", text: label }),
      h("button", { class: "x", type: "button", "aria-label": `Remove ${label}`, title: "Remove", onclick: onRemove }, "×"));
  }

  function renderSettings() {
    const out = [];
    const disabled = !S.db;

    // Preferences
    const prefForm = h("form", { class: "add", onsubmit: e => {
      e.preventDefault();
      const input = prefForm.querySelector("input");
      const text = input.value.trim();
      if (!text) return;
      write(() => S.db.collection("prefs").add({ text, active: true, createdAt: Date.now() }));
      input.value = "";
    } },
      h("input", { type: "text", id: "pref-input", placeholder: "e.g. I'm job hunting at small startups, show me Anthropic news", "aria-label": "New preference", maxlength: "300", disabled }),
      h("button", { class: "btn", type: "submit", disabled }, "Add"));
    out.push(h("section", { class: "panel" },
      h("h2", { text: "What you want to see" }),
      h("p", { class: "hint", text: "Plain words. Claude judges every post against the entries that are switched on." }),
      prefForm,
      S.prefs.length
        ? h("ul", { class: "items" }, S.prefs.map(p => {
            const sw = h("label", { class: "switch", title: p.active ? "On: pause this entry" : "Paused: turn it back on" },
              h("input", { type: "checkbox", "aria-label": `Use “${p.text}”`, checked: p.active !== false, onchange: e => write(() => S.db.doc(`prefs/${p.id}`).update({ active: e.target.checked })) }),
              h("span"));
            return listItem(p.text, sw, () => write(() => S.db.doc(`prefs/${p.id}`).delete()), p.active === false ? "paused" : "");
          }))
        : h("div", { class: "none", text: "No preferences yet. Until you add some, Claude leans on your votes and people lists." })));

    // People
    const peopleForm = h("form", { class: "add", onsubmit: e => {
      e.preventDefault();
      const input = peopleForm.querySelector("input");
      const list = peopleForm.querySelector("select").value;
      const parsed = parsePerson(input.value);
      if (!parsed) { input.setCustomValidity("Enter @handle, an x.com link or a linkedin.com/in/ link"); input.reportValidity(); return; }
      input.setCustomValidity("");
      write(() => S.db.doc(`people/${docId(parsed.site + ":" + parsed.handle.toLowerCase())}`).set({ ...parsed, list, createdAt: Date.now() }));
      input.value = "";
    } },
      h("input", { type: "text", id: "person-input", placeholder: "@handle or profile link", "aria-label": "Person", disabled, oninput: e => e.target.setCustomValidity("") }),
      h("select", { id: "person-list", "aria-label": "List", disabled },
        h("option", { value: "show" }, "Always show"),
        h("option", { value: "hide" }, "Always hide")),
      h("button", { class: "btn", type: "submit", disabled }, "Add"));
    const col = (list, title, empty) => {
      const people = S.people.filter(p => p.list === list);
      return h("div", {},
        h("h3", { text: title }),
        people.length
          ? h("ul", { class: "items" }, people.map(p => listItem(p.handle, h("span", { class: "chip", text: SITE[p.site] || p.site }), () => write(() => S.db.doc(`people/${p.id}`).delete()))))
          : h("div", { class: "none", text: empty }));
    };
    out.push(h("section", { class: "panel" },
      h("h2", { text: "People" }),
      h("p", { class: "hint", text: "Always show keeps every post by them; always hide drops them, whatever else they match." }),
      peopleForm,
      h("div", { class: "people-cols" },
        col("show", "Always show", "Nobody yet."),
        col("hide", "Always hide", "Nobody yet."))));

    // Keywords
    const kwForm = h("form", { class: "add", onsubmit: e => {
      e.preventDefault();
      const input = kwForm.querySelector("input");
      const text = input.value.trim();
      if (!text) return;
      write(() => S.db.doc(`keywords/${docId(text.toLowerCase())}`).set({ text, createdAt: Date.now() }));
      input.value = "";
    } },
      h("input", { type: "text", id: "kw-input", placeholder: "e.g. vibe coding", "aria-label": "Blocked keyword", maxlength: "80", disabled }),
      h("button", { class: "btn", type: "submit", disabled }, "Block"));
    out.push(h("section", { class: "panel" },
      h("h2", { text: "Blocked words" }),
      h("p", { class: "hint", text: "Any post containing one of these is dropped." }),
      kwForm,
      S.keywords.length
        ? h("div", { class: "kw" }, S.keywords.map(k => h("span", { class: "chip" }, k.text,
            h("button", { class: "x", type: "button", "aria-label": `Unblock ${k.text}`, onclick: () => write(() => S.db.doc(`keywords/${k.id}`).delete()) }, "×"))))
        : h("div", { class: "none", text: "No blocked words." })));

    // Strictness
    const out1 = h("output", { for: "threshold", text: S.threshold.toFixed(2) });
    const { kept } = partition();
    const keptLine = h("div", { class: "status-line", text: S.digest?.posts?.length ? `${kept.length} of ${S.digest.posts.length} posts in this digest pass.` : "" });
    out.push(h("section", { class: "panel" },
      h("h2", { text: "Strictness" }),
      h("p", { class: "hint", text: "Posts scoring at or above this make the digest. Higher means fewer, better posts." }),
      h("div", { class: "slider-row" },
        h("span", { class: "status-line", text: "More" }),
        h("input", { type: "range", id: "threshold", min: "0.3", max: "0.9", step: "0.05", value: String(S.threshold), "aria-label": "Strictness", disabled,
          oninput: e => { S.threshold = Number(e.target.value); out1.textContent = S.threshold.toFixed(2); const k = partition(); keptLine.textContent = S.digest?.posts?.length ? `${k.kept.length} of ${S.digest.posts.length} posts in this digest pass.` : ""; renderHeader({ kept: k.kept.length, dropped: k.dropped.length }); },
          onchange: e => write(() => S.db.doc("settings/main").set({ threshold: Number(e.target.value), updatedAt: Date.now() })) }),
        h("span", { class: "status-line", text: "Fewer" }),
        out1),
      keptLine));

    // Export / reset
    out.push(h("section", { class: "panel" },
      h("h2", { text: "Your data" }),
      h("p", { class: "hint", text: `${S.votes.size} votes, ${S.prefs.length} preferences, ${S.people.length} people, ${S.keywords.length} blocked words.` }),
      h("div", { class: "row" },
        S.downloads ? h("button", { class: "btn quiet", type: "button", onclick: exportData }, "Export as JSON") : null,
        h("button", { class: "btn danger", type: "button", disabled, onclick: resetAll },
          S.confirmReset ? "Tap again to delete everything" : "Clear preferences and votes")),
      S.exportMsg ? h("div", { class: "status-line", text: S.exportMsg }) : null));

    if (!S.db) out.unshift(h("div", { class: "notice warn" }, h("strong", { text: "Read-only here" }),
      h("span", { text: "Saving needs the page opened in Claude. Open it from your Claude app or claude.ai." })));
    return out;
  }

  function parsePerson(raw) {
    const s = raw.trim();
    if (!s) return null;
    const li = /linkedin\.com\/(in|company)\/([^/?#\s]+)/i.exec(s);
    if (li) return { site: "linkedin", handle: decodeURIComponent(li[2]) };
    const x = /(?:x|twitter)\.com\/([A-Za-z0-9_]{1,15})/i.exec(s);
    if (x) return { site: "x", handle: "@" + x[1] };
    const at = /^@?([A-Za-z0-9_]{1,15})$/.exec(s);
    if (at) return { site: "x", handle: "@" + at[1] };
    return null;
  }

  // ---------- actions ----------
  let toastTimer = 0;
  function write(fn) {
    if (!S.db) return;
    Promise.resolve().then(fn).catch(err => {
      S.exportMsg = err && err.code === "quota_exceeded"
        ? "Storage is full. Clear old votes under Your data, then try again."
        : "Couldn't save that. Check your connection and try again.";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { S.exportMsg = ""; render(); }, 6000);
      render();
    });
  }

  function castVote(p, v) {
    if (!S.db) return;
    const id = docId(p.id);
    const current = S.votes.get(id)?.vote || 0;
    const ref = S.db.doc(`votes/${id}`);
    if (current === v) { write(() => ref.delete()); return; }
    write(() => ref.set({
      postId: p.id, vote: v, site: p.site || null, feeds: p.feeds || [],
      author: { name: p.author?.name || "", handle: p.author?.handle || "" },
      text: (p.text || "").slice(0, 400), topic: p.topic || null,
      score: typeof p.score === "number" ? p.score : null, reason: p.reason || null,
      digestAt: S.digest?.generatedAt || null, at: Date.now(),
    }));
  }

  async function exportData() {
    const data = JSON.stringify({
      exportedAt: new Date().toISOString(),
      threshold: S.threshold,
      preferences: S.prefs.map(({ id, ...r }) => r),
      people: S.people.map(({ id, ...r }) => r),
      keywords: S.keywords.map(({ id, ...r }) => r),
      votes: [...S.votes.values()],
    }, null, 2);
    try {
      await S.downloads.save({ filename: "feed-curator-preferences.json", data });
      S.exportMsg = "Exported.";
    } catch (e) {
      S.exportMsg = e && e.code === "declined" ? "" : "Export isn't available here.";
    }
    render();
  }

  function resetAll() {
    if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(() => { S.confirmReset = false; render(); }, 5000); return; }
    S.confirmReset = false;
    const refs = [
      ...S.prefs.map(p => `prefs/${p.id}`), ...S.people.map(p => `people/${p.id}`),
      ...S.keywords.map(k => `keywords/${k.id}`), ...[...S.votes.keys()].map(id => `votes/${id}`),
    ];
    write(async () => {
      for (const path of refs) await S.db.doc(path).delete();
      await S.db.doc("settings/main").set({ threshold: 0.6, updatedAt: Date.now() });
    });
  }

  function pruneVotes() {
    if (prunedVotes || S.votes.size <= VOTE_CAP) return;
    prunedVotes = true;
    const old = [...S.votes.entries()].sort((a, b) => (a[1].at || 0) - (b[1].at || 0)).slice(0, S.votes.size - VOTE_CAP);
    write(async () => { for (const [id] of old) await S.db.doc(`votes/${id}`).delete(); });
  }

  // ---------- render ----------
  function render() {
    const view = document.getElementById("view");
    const keepScroll = window.scrollY;
    const { kept, dropped } = partition();
    renderHeader(S.digest ? { kept: kept.length, dropped: dropped.length } : null);

    let content;
    if (S.tab === "settings") content = renderSettings();
    else if (S.digest === undefined && !S.offline) content = [h("div", { class: "empty" }, h("h2", { text: "Loading your digest" }), h("p", { text: "Fetching the latest curated posts." }))];
    else if (!S.digest) content = [h("div", { class: "empty" },
      h("h2", { text: S.offline ? "Open this page in Claude" : "No digest yet" }),
      h("p", { text: S.offline
        ? "The digest and your preferences are stored with this page in Claude. Open it from the Claude app or claude.ai to see them."
        : "Your first digest appears here after the next capture: 07:45 and 17:45, curated a few minutes later. Meanwhile, add what you want to see under Preferences." }),
      h("button", { class: "btn quiet", type: "button", onclick: () => setTab("settings") }, "Set preferences"))];
    else content = renderList(S.tab === "dropped" ? dropped : kept, S.tab);

    view.replaceChildren(...content);
    window.scrollTo(0, keepScroll);
  }

  function setTab(t) {
    S.tab = t;
    try { localStorage.setItem("fc.tab", t); } catch {}
    render();
    window.scrollTo(0, 0);
  }
  for (const t of ["digest", "dropped", "settings"]) {
    document.getElementById(`tab-${t}`).addEventListener("click", () => setTab(t));
  }

  // Inputs being typed in survive a live update: re-render only when no form field has focus.
  let pending = false;
  function scheduleRender() {
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "SELECT") && a.type !== "checkbox" && a.type !== "range") {
      if (!pending) { pending = true; a.addEventListener("blur", () => { pending = false; render(); }, { once: true }); }
      return;
    }
    render();
  }

  // ---------- store ----------
  render();
  const claudeApi = window.claude;
  if (!claudeApi || typeof claudeApi.use !== "function") {
    S.offline = true;
    render();
    return;
  }
  claudeApi.use("downloads").then(d => { S.downloads = d; if (S.tab === "settings") render(); }).catch(() => {});
  claudeApi.use("db").then(db => {
    if (!db) { S.offline = true; render(); return; }
    S.db = db;
    const onErr = () => {};
    const rows = snap => snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    db.doc("digest/current").onSnapshot(s => { S.digest = s.exists ? s.data() : null; scheduleRender(); }, () => { S.digest = null; render(); });
    db.doc("settings/main").onSnapshot(s => {
      const t = s.exists ? Number(s.data().threshold) : NaN;
      if (isFinite(t)) S.threshold = t;
      scheduleRender();
    }, onErr);
    db.collection("prefs").orderBy("createdAt").onSnapshot(s => { S.prefs = rows(s); scheduleRender(); }, onErr);
    db.collection("people").orderBy("createdAt").onSnapshot(s => { S.people = rows(s); scheduleRender(); }, onErr);
    db.collection("keywords").orderBy("createdAt").onSnapshot(s => { S.keywords = rows(s); scheduleRender(); }, onErr);
    db.collection("votes").onSnapshot(s => {
      S.votes = new Map(s.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
      pruneVotes();
      scheduleRender();
    }, onErr);
    render();
  }).catch(() => { S.offline = true; render(); });
})();
</script>
